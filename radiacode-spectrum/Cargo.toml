[package]
name = "radiacode-spectrum"
version = "0.2.0"
edition = "2024"
rust-version = "1.92"
description = "Spectrum analysis program for RadiaCode detectors"
license = "AGPL-3.0-only"

[dependencies]
async-trait = "0.1"
eframe = "0.35"
egui = "0.35"
egui_plot = "0.36"
radiacode-lib = { workspace = true, features = ["usb", "bluetooth", "serde"] }
radiacode-nuclides = { path = "../radiacode-nuclides" }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
directories = "6"
time = { version = "0.3", features = ["formatting", "local-offset", "macros"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
crossbeam-channel = "0.5"
rfd = "0.15"

[target.'cfg(target_os = "linux")'.dependencies]
bdaddr = "0.2.0-alpha.4"
btmgmt = "0.3.0-alpha.4"
futures = "0.3"

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "test-util"] }
